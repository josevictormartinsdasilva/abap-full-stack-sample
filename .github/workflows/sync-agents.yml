name: sync-agents

# Garante que os adaptadores de cada ferramenta (.claude/, .codex/, .kimi-code/, .mcp.json,
# .agents/mcp_config.json) estão em sincronia com a fonte única em .agents/.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verificar arquivos gerados
        run: node scripts/sync-agents.mjs --check
