# GERADO por scripts/sync-agents.mjs — não edite; altere a fonte em .agents/ e rode o script.
# Exige projeto confiável (trusted). As regras do orquestrador vêm do AGENTS.md (lido nativamente pelo Codex).
# O token do abap-adt vem da variável de ambiente (nunca versionar o valor).

[agents]
max_threads = 4
max_depth = 1

[mcp_servers.abap-adt]
url = "http://localhost:2236/mcp"
bearer_token_env_var = "ABAP_ADT_TOKEN"

[mcp_servers.fiori-mcp]
command = "cmd"
args = ["/c", "npx", "--yes", "@sap-ux/fiori-mcp-server@1.15.19", "fiori-mcp"]
startup_timeout_sec = 600
